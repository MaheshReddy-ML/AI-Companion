<section class="auth-doorway-story" aria-label="Emora atmosphere">
  <a class="auth-doorway-brand" href="/" aria-label="Emora home">
    <span class="auth-doorway-mark"><img src="/static/images/emora-logo-v2-192.png?v=20260828-orbit" alt="" /></span>
    <span>Emora</span>
  </a>

  <div class="auth-doorway-copy">
    <p class="auth-doorway-kicker">{{ auth_story_kicker }}</p>
    <h1>{{ auth_story_heading | safe }}</h1>
    <p>{{ auth_story_body }}</p>
  </div>

  <div class="auth-doorway-landscape" data-atmosphere-scene>
    <div class="atmosphere-sky" aria-hidden="true">
      <div class="atmosphere-orb"></div>
      <div class="atmosphere-cloud atmosphere-cloud-one"></div>
      <div class="atmosphere-cloud atmosphere-cloud-two"></div>
      <div class="atmosphere-stars"></div>
      <div class="atmosphere-rain"></div>
      <div class="atmosphere-mist"></div>
      <div class="auth-doorway-haze"></div>
      <div class="auth-doorway-ridge auth-doorway-ridge-far"></div>
      <div class="auth-doorway-ridge auth-doorway-ridge-near"></div>
      <div class="auth-doorway-light auth-doorway-light-one"></div>
      <div class="auth-doorway-light auth-doorway-light-two"></div>
      <div class="auth-doorway-presence"><img src="/static/images/emora-logo-v2.png?v=20260828-orbit" alt="" /></div>
    </div>
    <div class="auth-doorway-time" aria-live="polite">
      <span data-atmosphere-icon>◌</span>
      <span><strong data-atmosphere-title>A scene for your time</strong><small data-atmosphere-detail>Local atmosphere</small></span>
      <button data-atmosphere-location type="button">Use location</button>
    </div>
  </div>

  <p class="auth-doorway-promise">Private by design <b>·</b> Yours to return to</p>
</section>
