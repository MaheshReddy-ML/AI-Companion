<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Emora is an emotionally aware AI companion with secure sign-in, guided conversations, and a research-inspired workspace."
  />
  <title>{{ page_title }} | Emora</title>
  <script>
    (function () {
      try {
        const storedTheme = localStorage.getItem("theme") || "dark";
        const resolvedTheme =
          storedTheme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : storedTheme;

        const root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add(resolvedTheme);
        root.dataset.themePreference = storedTheme;
        root.style.colorScheme = resolvedTheme;
      } catch (error) {
        document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = "dark";
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/emora.css?v=20260710-design-system" />
  <link rel="stylesheet" href="/static/css/polish.css" />
  <link rel="stylesheet" href="/static/css/flagship.css?v=20260710-flagship-v8" />
  <script>
    window.APP_CONFIG = {{ { "googleClientId": google_client_id } | tojson }};
  </script>
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  <nav class="mobile-app-nav" aria-label="Workspace navigation">
    <a class="mobile-app-nav-item {% if page_title == 'Dashboard' %}active{% endif %}" href="/dashboard" aria-label="Dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h7V4H4v9Zm0 7h7v-5H4v5Zm9 0h7v-9h-7v9Zm0-11h7V4h-7v5Z"/></svg>
      <span>Home</span>
    </a>
    <a class="mobile-app-nav-item {% if page_title == 'Your Emora' %}active{% endif %}" href="/your-emora" aria-label="Your Emora">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a6 6 0 0 0-6 6v2.1A4 4 0 0 0 4 13.5V16a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4v-2.5a4 4 0 0 0-2-3.4V8a6 6 0 0 0-6-6Zm-3 8V8a3 3 0 1 1 6 0v2H9Zm0 5.5a1.25 1.25 0 1 1 2.5 0 1.25 1.25 0 0 1-2.5 0Zm3.5 1.8c.8.55 2.2.55 3 0l.8 1.15c-1.25.9-3.35.9-4.6 0l.8-1.15Zm1-1.8a1.25 1.25 0 1 1 2.5 0 1.25 1.25 0 0 1-2.5 0Z"/></svg>
      <span>Emora</span>
    </a>
    <a class="mobile-app-nav-item {% if page_title == 'Companion' %}active{% endif %}" href="/chat" aria-label="Companion chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v6A3.5 3.5 0 0 1 16.5 15H11l-5.2 4.1A1.1 1.1 0 0 1 4 18.2V5.5Z"/></svg>
      <span>Chat</span>
    </a>
    <a class="mobile-app-nav-item {% if page_title == 'Insights' %}active{% endif %}" href="/insights" aria-label="Insights">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h14v2H5v-2Zm1-2h3V9H6v8Zm5 0h3V3h-3v14Zm5 0h3V6h-3v11Z"/></svg>
      <span>Insights</span>
    </a>
    <a class="mobile-app-nav-item {% if page_title == 'Community' %}active{% endif %}" href="/community" aria-label="Community">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 11A3.5 3.5 0 1 0 8.5 4a3.5 3.5 0 0 0 0 7Zm7 0A3.5 3.5 0 1 0 15.5 4a3.5 3.5 0 0 0 0 7ZM3 20a5.5 5.5 0 0 1 11 0v1H3v-1Zm9.5 1v-1a7 7 0 0 0-1.3-4.1A5.5 5.5 0 0 1 21 19.4V21h-8.5Z"/></svg>
      <span>Community</span>
    </a>
    <a class="mobile-app-nav-item {% if page_title == 'Profile' %}active{% endif %}" href="/profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm-8 9a8 8 0 0 1 16 0v1H4v-1Z"/></svg>
      <span>Profile</span>
    </a>
  </nav>
  <script type="module" src="/static/js/motion.js?v=20260710-flagship"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
