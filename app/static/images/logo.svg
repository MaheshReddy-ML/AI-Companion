<svg width="600" height="600" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emora-logo-title emora-logo-description">
  <title id="emora-logo-title">Emora</title>
  <desc id="emora-logo-description">A flowing lowercase e shaped like an open conversation.</desc>
  <defs>
    <linearGradient id="emora-bg" x1="19" y1="12" x2="108" y2="117" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171C30"/>
