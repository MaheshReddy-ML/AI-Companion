<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">The Emora companion cast</title>
  <desc id="description">Three stylized companion portraits in a midnight blue environment.</desc>
