<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">Emora — a living, emotionally aware AI companion</title>
  <desc id="description">Animated midnight blue companion interface with flowing memory, emotion, voice and avatar signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b17"/>
      <stop offset="0.52" stop-color="#101a34"/>
      <stop offset="1" stop-color="#07151c"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d4fff2" stop-opacity=".98"/>
      <stop offset=".18" stop-color="#79e5cf" stop-opacity=".9"/>
      <stop offset=".52" stop-color="#6b87f0" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6b87f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#74e7d2" stop-opacity="0"/>
      <stop offset=".48" stop-color="#b7fff1" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8a9fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="44"/></filter>
  </defs>
  <rect width="1600" height="620" rx="32" fill="url(#bg)"/>
  <g opacity=".32" filter="url(#soft)">
    <circle cx="230" cy="118" r="120" fill="#5d75e9"><animate attributeName="cy" values="118;152;118" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1320" cy="470" r="165" fill="#35c7ae"><animate attributeName="cx" values="1320;1270;1320" dur="9s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".8">
    <path d="M105 160 C 360 70, 495 495, 795 315 S 1240 75, 1500 162" stroke-dasharray="14 20"><animate attributeName="stroke-dashoffset" values="0;-272" dur="12s" repeatCount="indefinite"/></path>
    <path d="M80 500 C 340 600, 498 150, 788 315 S 1210 582, 1545 420" stroke-dasharray="8 25"><animate attributeName="stroke-dashoffset" values="0;264" dur="13s" repeatCount="indefinite"/></path>
  </g>
  <g transform="translate(793 312)">
    <circle r="210" fill="none" stroke="#91f1df" stroke-opacity=".12"/>
    <circle r="165" fill="none" stroke="#9eb0ff" stroke-opacity=".17" stroke-dasharray="4 13"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></circle>
    <circle r="126" fill="url(#orb)" filter="url(#glow)"><animate attributeName="r" values="119;130;119" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle r="52" fill="#d8fff5" fill-opacity=".93"><animate attributeName="opacity" values=".72;1;.72" dur="2.4s" repeatCount="indefinite"/></circle>
    <text y="10" text-anchor="middle" fill="#12283a" font-family="Arial, sans-serif" font-size="42" font-weight="700">e</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="118" y="110" fill="#9ef0dd" font-size="16" font-weight="700" letter-spacing="4">EMOTIONALLY AWARE • PRIVATE BY DESIGN</text>
    <text x="116" y="194" fill="#f3f7ff" font-size="76" font-weight="700" letter-spacing="-3">Emora</text>
    <text x="119" y="248" fill="#b8c7dc" font-size="25">A companion that listens, remembers, and grows with you.</text>
    <g transform="translate(118 304)">
      <rect width="155" height="48" rx="24" fill="#1d3a4a" stroke="#68d8c0" stroke-opacity=".45"/>
      <circle cx="28" cy="24" r="7" fill="#78e7cc"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle>
      <text x="48" y="30" fill="#d9fff5" font-size="16" font-weight="700">MEMORY</text>
      <rect x="171" width="155" height="48" rx="24" fill="#202d55" stroke="#8ea2ff" stroke-opacity=".45"/>
      <circle cx="199" cy="24" r="7" fill="#99aaff"/>
      <text x="219" y="30" fill="#e9edff" font-size="16" font-weight="700">VOICE</text>
      <rect x="342" width="168" height="48" rx="24" fill="#203d3d" stroke="#8aead5" stroke-opacity=".45"/>
      <circle cx="370" cy="24" r="7" fill="#8aead5"/>
      <text x="390" y="30" fill="#e0fff8" font-size="16" font-weight="700">PRESENCE</text>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.3">
    <g transform="translate(1040 130)"><rect width="286" height="70" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".13"/><circle cx="31" cy="35" r="9" fill="#70e3cb"/><text x="55" y="31" fill="#d9fff5">REMEMBERS</text><text x="55" y="51" fill="#90a5bb" font-size="12" font-weight="400" letter-spacing="0">the details that matter</text></g>
    <g transform="translate(1168 234)"><rect width="286" height="70" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".13"/><circle cx="31" cy="35" r="9" fill="#9caeff"/><text x="55" y="31" fill="#ecf0ff">RESPONDS</text><text x="55" y="51" fill="#90a5bb" font-size="12" font-weight="400" letter-spacing="0">with emotional context</text></g>
    <g transform="translate(1055 408)"><rect width="286" height="70" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".13"/><circle cx="31" cy="35" r="9" fill="#f2cc78"/><text x="55" y="31" fill="#fff3d8">COMES ALIVE</text><text x="55" y="51" fill="#90a5bb" font-size="12" font-weight="400" letter-spacing="0">through VRM motion and local TTS</text></g>
  </g>
  <text x="118" y="560" fill="#7290a9" font-family="Arial, Helvetica, sans-serif" font-size="15">FASTAPI  •  MONGODB  •  OPENAI-COMPATIBLE CHAT  •  QWEN3-TTS  •  VRM</text>
</svg>
