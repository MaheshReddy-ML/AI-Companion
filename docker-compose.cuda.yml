services:
  emora:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    env_file: .env
    environment:
      EMORA_BACKEND: cuda
      DEVICE: cuda
      HF_HOME: /models/huggingface
    ports:
      - "8000:8000"
    volumes:
      - emora-model-cache:/models/huggingface
      - emora-audio-cache:/opt/emora/cache/audio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  emora-model-cache:
  emora-audio-cache:
